server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Quan trọng: tất cả route về index.html để React Router xử lý
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets lâu dài (Vite tự thêm content hash vào tên file)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Không cache index.html (để nhận code mới sau deploy)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
}
