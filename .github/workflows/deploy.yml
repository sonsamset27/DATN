name: 🚀 CI/CD — Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BE_IMAGE: ghcr.io/${{ github.repository_owner }}/datn-be
  FE_IMAGE: ghcr.io/${{ github.repository_owner }}/datn-fe

jobs:
  # ============================================================
  # JOB 1: LINT (chạy cả PR và push)
  # ============================================================
  lint:
    name: 🔍 Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: FE/package-lock.json

      - name: Install FE dependencies
        run: npm install --legacy-peer-deps
        working-directory: ./FE

      - name: Lint Frontend (oxlint)
        run: npm run lint
        working-directory: ./FE
        continue-on-error: true  # Không block deploy nếu lint warn

  # ============================================================
  # JOB 2: BUILD & PUSH DOCKER IMAGES (chỉ khi push vào main)
  # ============================================================
  build-and-push:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      be_image_tag: ${{ steps.meta-be.outputs.tags }}
      fe_image_tag: ${{ steps.meta-fe.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----- BACKEND -----
      - name: Docker metadata (BE)
        id: meta-be
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BE_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./BE
          push: true
          tags: ${{ steps.meta-be.outputs.tags }}
          labels: ${{ steps.meta-be.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----- FRONTEND -----
      - name: Docker metadata (FE)
        id: meta-fe
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FE_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./FE
          push: true
          tags: ${{ steps.meta-fe.outputs.tags }}
          labels: ${{ steps.meta-fe.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=https://api.credential.dcsystem.space/api/v1
            VITE_WALLET_CONNECT_PROJECT_ID=${{ secrets.VITE_WALLET_CONNECT_PROJECT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 3: DEPLOY LÊN VPS
  # ============================================================
  deploy:
    name: 🚀 Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production   # Yêu cầu approve thủ công (cấu hình trong GitHub Settings)

    steps:
      - name: SSH vào VPS và deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e   # Dừng ngay nếu có lệnh lỗi

            echo "📦 Pulling latest Docker images..."
            cd /opt/datn
            docker compose pull

            echo "🔄 Restarting containers with new images..."
            docker compose up -d --no-deps --remove-orphans

            echo "⏳ Waiting for backend to be healthy..."
            for i in $(seq 1 12); do
              if docker inspect --format='{{.State.Health.Status}}' datn_backend 2>/dev/null | grep -q healthy; then
                echo "✅ Backend is healthy!"
                break
              fi
              if [ $i -eq 12 ]; then
                echo "❌ Backend health check timed out!"
                docker logs datn_backend --tail 50
                exit 1
              fi
              echo "Waiting... ($i/12)"
              sleep 5
            done

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Deploy thành công! Commit: ${{ github.sha }}"

  # ============================================================
  # JOB 4: SMOKE TEST SAU KHI DEPLOY
  # ============================================================
  smoke-test:
    name: 🔥 Smoke Test
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Test Backend Health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://api.credential.dcsystem.space/)
          if [ "$response" != "200" ]; then
            echo "❌ Backend health check failed! HTTP $response"
            exit 1
          fi
          echo "✅ Backend responding with 200 OK"

      - name: Test Frontend
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://credential.dcsystem.space/)
          if [ "$response" != "200" ]; then
            echo "❌ Frontend check failed! HTTP $response"
            exit 1
          fi
          echo "✅ Frontend responding with 200 OK"
